# The default agent group: OSG's FSM (`nav_agent`), sensor-only, on the frozen
# PointNav mover, with the S71 control settings. S71's 63.0% SR on
# `scenes20_ep0to4` (docs/history/AB_RESULTS.md) was measured with the ASCENT
# transcription, which this copy no longer carries.
defaults:
  - base_default

policy: nav_agent
navigation: pointnav
approach_abandon_steps: 100
escape_window: 30
frontier_stick_rule: closing
terminal_requires_detection: false
terminal_rule: nearest_point
terminal_stop_m: 0.4
