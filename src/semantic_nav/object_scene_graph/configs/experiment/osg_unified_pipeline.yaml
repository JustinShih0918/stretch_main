# @package _global_
#
# The single fused pipeline: every MECHANISM flag, and nothing about which
# dataset is run. Included by ycb15_osg_unified and the robot presets
# (stretch3_map, isaac_hospital_map) so the agent is the same everywhere; only
# the eval group and the scene list differ between them.
#
# The DualMap perception tuning (values from dualmap_protocol_osg_sensor_v4_fuse_cls,
# the 62/107 arm) + the region-proposal fusion; see docs/UNIFIED_PIPELINE.md.
# The floor/climb group it also carried was removed with multi-floor support.

agent:
  agent_radius: 0.1
  approach_close_clearance_m: 0.15
  approach_close_last_metre_m: 0.8
  approach_close_source: costmap
  approach_stop_at_best_m: 0.15
  navmesh_snap_on_agent_island: true
  pointnav_arrival_m: 0.3
  pointnav_creep_stall_steps: 8
  close_look_before_absence: true

exploration:
  # DualMap's value (fuse_cls): true perturbs exploration (measured: broke
  # scissors' bit-identity).
  frontier_cost_free_cell: false
  search_proximity_len_m: 100.0

verification:
  failed_attempt_disables_place: true
  retire_stale_twins_after_absence: true
  stale_stop_at_nearest_free: true
  stop_at_stale_anchor_once: true
  viewpoint_min_clearance_m: 0.25
  ring_radius_extent_aware: true
  ring_radii_m: [0.35, 0.5, 0.65, 0.8, 1.2, 1.5, 2.0]

scene_graph:
  # Surface tops measured from the floor, not from y=0 (docs/UNIFIED_PIPELINE.md).
  containers_floor_relative: true

region_proposal:
  commit_min_obs: 4
  commit_tau: 0.28
  commit_tau_by_class:
    bowl: 0.3
    mug: 0.3
    plate: 0.3
    red_plate: 0.3
  enabled: true
  every_keyframe: true
  max_per_episode: 100000
