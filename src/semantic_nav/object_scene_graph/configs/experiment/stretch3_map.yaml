# @package _global_
#
# Run 1 on the Hello Robot Stretch 3: explore the place, keep the map.
#
#   bash scripts/ros2/bridge.sh                     # in one shell
#   python scripts/run_robot.py +experiment=stretch3_map ros2.map_tag=lab
#
# The OSG pipeline as the unified preset composes it, minus everything that
# assumes a simulator:
#
#   the mover is Nav2 -- the robot has its own navigator, its own footprint
#   and its own recovery behaviours, and nothing here plans better than that;
#
#   the storey is declared, not measured. `map` is 2D, so the estimator's
#   height trace does not exist; the operator publishes /osg/floor instead
#   (floor.source=external, docs/ROS2.md);
#
#   nothing climbs. The stair machinery the unified preset turns on assumes
#   the agent can walk up a staircase it detected; the Stretch cannot, and a
#   portal pursuit with no way to complete it just burns the step budget.
#   Floors change because an operator says so, and by no other route.
#
# Verify against the real robot before trusting a run: the `ros2.*` topics,
# `ros2.rotate_deg`, `agent.camera_height` and `eval.hfov_deg` (docs/ROS2.md).
defaults:
  - osg_unified_pipeline
  - override /eval: hm3d_val_mini      # replaced wholesale below; nothing HM3D is read
  - override /detector: yoloe
  - override /verification: "off"
  - _self_

agent:
  navigation: nav2
  policy: nav_agent
  # The D435i on the Stretch's head, at its default tilt. VERIFY ON ROBOT:
  # this is the distance from the floor to the optical frame, and every floor
  # decision and obstacle band is measured from it.
  camera_height: 1.3
  agent_radius: 0.18          # the Stretch's footprint, not the sim agent's
  # A step is a decision, not a distance, once Nav2 drives continuously; these
  # are what the FSM's OWN actions (the opening scan, the escape window) are
  # metered to on cmd_vel.
  forward_m: 0.25
  turn_deg: 30.0
  max_steps: 400
  initial_scan: true
  # Nav2 refusing a goal is a statement about the goal, so retire the frontier
  # rather than press into it.
  pointnav_stop_means_blocked: true
  # Nav2 owns the last metre: it has the footprint and a goal tolerance, and
  # the blind creep exists only because PointNav's stop radius does not.
  pointnav_approach_creep_m: 0.0
  # Not a simulator: there is no navmesh to snap a goal onto, and no 3D goal.
  navmesh_3d_goals: false
  navmesh_snap_on_agent_island: false
  # Nothing climbs.
  climb_enabled: false
  down_look_every: 0
  # A storey the agent has finished -- no frontier left, or the budget below
  # spent on it -- is the operator's cue to carry it to one nobody has mapped
  # (the search pass may restore a one-storey map): the agent names the lowest
  # unvisited key, RViz and the console say "wants floor N", and publishing
  # /osg/floor N is the arrival. 0 below is no per-storey step budget.
  request_new_storey_when_exhausted: true
  request_new_storey_after_steps: 0
  # The escape window watches the agent's OWN action history for a stall it
  # should break out of. With Nav2 driving, that history is a placeholder
  # repeated once per tick (planning/nav2_driver.py), so the window fires on a
  # leg that is going perfectly well -- and Nav2 already owns stall recovery,
  # with the robot's footprint and a local costmap this pipeline does not have.
  escape_window: 0

mapping:
  # MEASURED ON THE ROBOT, 2026-09-23 (outputs/20260922_232853): on the glossy
  # first-floor corridor the map put obstacle speckle under the base -- 23 of
  # 101 poses on OCCUPIED cells, 57 on free islands under 50 cells, 98 free
  # components -- and frontier detection, which grows from the robot's own
  # component, found nothing: the agent turned in place while a doorway sat
  # two metres away. The robot IS where it stands: footprint (0.18) plus the
  # inflation margin (0.07) and a little.
  footprint_clear_m: 0.30

floor:
  source: external
  enabled: true
  estimate_only: false
  per_floor_costmap: true
  # The two storeys are separated by the switch alone, so no mechanism that
  # infers a storey or walks between them is wanted.
  cross_floor: false
  stairs: false
  use_prior_stairs: false
  prior_stairs_override_gate: false
  no_level_on_flight: false
  hold_pursuit: false
  switch_requires_second_level: false

exploration:
  # The floor LLM proposes climbing to another storey. The operator decides
  # storeys here.
  floor_llm: false
  search_floor_requires_anchor_test: false
  # MEASURED ON THE ROBOT, 2026-09-23 (outputs/20260922_234724): the give-up
  # rule's 15 steps is ~15 s here, less than Nav2 takes to plan and run one
  # recovery at a doorway; goals it had accepted were cancelled after 4-18 s
  # and the doorway frontier blocked for 100 steps while the robot went the
  # other way. Three quarters of a minute before a frontier is called blocked.
  giveup_after_steps: 45

# MEASURED ON THE ROBOT, 2026-09-22: the first mapping run built a `ball` track
# from the region proposer alone and never approached it. Re-running YOLOE
# over that run's keyframes with its own vocabulary found the ball only at
# 0.28 and 0.22 -- under the simulator-tuned detector floor of 0.30, so the
# detector never named it -- and both under verification.min_score 0.35. A
# real camera on a base that is still decelerating when the scan frame is
# taken scores lower than the simulator ever does; these two floors are
# lowered to let a real sighting reach the candidate gate. The other gates
# (min_bbox_px, min_obs, min_evidence, the proposal bar) are unchanged.
#
# LOWERED AGAIN 2026-09-22, on the operator's call, for the real-world runs
# only: "you see anything, build it in the scene graph". Two runs had put the
# ball in the graph from single sightings (0.51, 0.71) that no gate would act
# on, and one clear 0.31 sighting never entered the graph at all, because
# admission is scene_graph.min_det_score (0.35), not the floors above. So on
# the robot every detection the detector names is admitted, and one sighting
# with a fifth of the evidence bar is a candidate. The simulator arms keep
# their measured values; nothing here is a default.
detector:
  conf: 0.2
scene_graph:
  min_det_score: 0.0
  min_det_bbox_px: 0.0
  target_bypasses_gates: true
  # MEASURED ON THE ROBOT, 2026-09-22 (outputs/20260922_185444): the unified
  # preset this one composes from ships the presence filter OFF, so
  # `object_layer.presence_filter` is None, `absence.observe` returns before
  # taking a reading (`presence_events: []`), and a close look that saw no
  # ball let the STOP stand -- the run ended at the empty spot, 37 steps in.
  # The filter is the mechanism the search pass exists to show (docs/PAPER.md
  # III-C); on the robot it is on, and the restored map's beliefs start at
  # `reload_max_log_odds` as they always did.
  presence:
    enabled: true
verification:
  min_score: 0.25
  min_bbox_px: 600
  min_obs: 1
  min_evidence: 0.2
  # MEASURED ON THE ROBOT, 2026-09-22 (outputs/20260922_184502): the search
  # pass walked to the ball's remembered spot, the close look saw nothing
  # (close_look_absence 1) -- and then STOPped there anyway, ending the run 41
  # steps in with the ball gone. That is `stop_at_stale_anchor_once` doing
  # what the unified preset means it to: under the DualMap protocol a stale
  # anchor gets one deliberate STOP because it "costs one attempt of three"
  # and a failed attempt is re-armed by eval/attempts.py. A robot has ONE
  # attempt (eval.attempts above), so the same STOP is the whole run. Off
  # here, the absence reading applies instead and the search goes on.
  stop_at_stale_anchor_once: false
  # MEASURED ON THE ROBOT, 2026-09-22 (outputs/20260922_191444): one 0.36
  # "sports ball" at 4.9 m, 34 steps before arrival, counted as "seen this
  # approach" and the run STOPped at the empty spot with the belief at 0.44.
  # At conf 0.2 the detector will name a ball across a room; only a sighting
  # inside 3 m -- where its recall is measured -- may protect the stop.
  seen_counts_within_m: 3.0

eval:
  mode: ros2
  # The D435i's colour stream, AFTER ros2.rotate_deg=90 turns the portrait
  # mount upright: 640x480 published becomes 480x640 consumed. These describe
  # what the pipeline sees. Intrinsics come from CameraInfo, not from hfov.
  rgb_width: 480
  rgb_height: 640
  hfov_deg: 42.5              # the D435i's 69-degree horizontal FOV, rotated
  depth_min_m: 0.3
  depth_max_m: 5.0
  attempts: 1                 # nothing scores an attempt on a robot
  save_viz: true
  debug_frames: false

ros2:
  map_mode: map
  # RViz shows the storey the agent is on; the floor it left clears at the
  # switch (the two-floor demo is watched live, and a stacked graph reads as
  # "the old objects are still there").
  viz_other_storeys: false
