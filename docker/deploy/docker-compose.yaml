name: stretch-main-deploy

# On-robot deployment: builds the shared BT engine + vendored hello-robot
# nav/slam (stretch_nav2), then runs them against the real Stretch hardware.
#
# The Stretch hardware driver (stretch_core) + calibrated URDF are expected to
# come from the robot's own hello-robot install. Source that workspace as an
# underlay before these services (or mount it in and extend the build command).
#
# Usage (run from the repo root, on the robot):
#   docker compose -f docker/deploy/docker-compose.yaml run --rm build
#   docker compose -f docker/deploy/docker-compose.yaml run --rm nav
#   docker compose -f docker/deploy/docker-compose.yaml run --rm bt

x-deploy-image: &deploy-image
  build:
    context: .
    dockerfile: Dockerfile
    args:
      ROS_DISTRO: humble
  image: stretch-main-deploy:latest
  working_dir: /ws
  volumes:
    - ../../:/ws
    # Robot hardware access (lidar, base, etc.)
    - /dev:/dev
  privileged: true
  network_mode: host
  environment:
    - RCUTILS_COLORIZED_OUTPUT=1
    - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}

services:
  # One-shot build of the deploy package subset.
  build:
    <<: *deploy-image
    container_name: stretch-main-deploy-build
    command:
      - bash
      - -lc
      - >-
        source /opt/ros/humble/setup.bash &&
        colcon build --packages-up-to bt_engine stretch_nav2 --symlink-install

  # nav2 + slam_toolbox bringup for the real robot.
  nav:
    <<: *deploy-image
    container_name: stretch-main-deploy-nav
    command:
      - bash
      - -lc
      - >-
        source /opt/ros/humble/setup.bash &&
        source install/setup.bash &&
        ros2 launch stretch_nav2 navigation.launch.py

  # The BehaviorTree engine that drives navigate_to_pose.
  bt:
    <<: *deploy-image
    container_name: stretch-main-deploy-bt
    command:
      - bash
      - -lc
      - >-
        source /opt/ros/humble/setup.bash &&
        source install/setup.bash &&
        ros2 run bt_engine bt_engine

  # Interactive shell with the workspace mounted.
  dev:
    <<: *deploy-image
    container_name: stretch-main-deploy-dev
    command: /bin/bash
    tty: true
    stdin_open: true
