name: stretch-main-vln

# StreamVLN inference server: host network, HTTP on :18080. The ROS side
# (src/semantic_nav/vln_policy) talks to it via the wire contract in
# src/semantic_nav/vln_policy/DESIGN.md — nothing ROS in here, so this can
# run on any GPU machine (24 GB VRAM fits the 7B model comfortably).
#
# Usage (run from the repo root, on the GPU machine hosting the model):
#   docker compose -f docker/vln/compose.yaml up -d
#   curl localhost:18080/health
# Then point the demo at it from the sim machine:
#   ./run_vln_demo.sh server_url:=http://<server-ip>:18080
#
# VLN_GPU_ID selects the GPU (default 0 — a dedicated inference machine).
# When sharing the Isaac Sim machine, use VLN_GPU_ID=1 so Isaac keeps GPU 0.
#
# The checkpoint download (~16 GB) is gated: leave STREAMVLN_MODEL empty to
# build/tinker without it (the server then answers /health with 503).
#
# NOTE: the server is unauthenticated HTTP — keep :18080 inside the lab
# network (firewall), do not expose it to the internet.

services:
  vln-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Set to "" to skip the multi-GB checkpoint download.
        STREAMVLN_MODEL: "YES"
        # Pin a StreamVLN commit here once validated (default: main).
        STREAMVLN_COMMIT: "main"
    image: stretch-main-vln:latest
    container_name: stretch-main-vln-server
    network_mode: host
    restart: unless-stopped
    environment:
      - PORT=18080
      # Only the GPU selected below is exposed, so it is always cuda:0
      # inside the container regardless of VLN_GPU_ID.
      - DEVICE=cuda:0
      # Set to "sdpa" if flash-attn was not built into the image.
      - ATTN_IMPL=${ATTN_IMPL:-flash_attention_2}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VLN_GPU_ID:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
